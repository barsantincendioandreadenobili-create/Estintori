<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#EDEFEA; --card:#FFFFFF; --ink:#1C2321; --ink-soft:#4B534F; --steel:#6B7570;
    --line:rgba(28,35,33,0.10);
    --teal:#3D6A5C; --teal-bg:#E4EEE9;
    --amber:#B9791F; --amber-bg:#F5EAD3;
    --red:#B8402C; --red-bg:#F5E1DC;
    --gray:#8B9290; --gray-bg:#E9E9E4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:'Inter',sans-serif}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  .container{max-width:920px;margin:0 auto;padding:0 16px}

  .topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .topbar-inner{display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-badge{width:36px;height:36px;flex:none;border-radius:9px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .brand-badge img{width:100%;height:100%;object-fit:cover;display:block}
  .brand-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;color:var(--ink);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-sub{font-size:11px;color:var(--steel)}
  .tabs{display:flex;gap:4px;overflow-x:auto}
  .tab{padding:9px 4px;margin-right:18px;background:none;border:none;border-bottom:2px solid transparent;color:var(--steel);font-weight:600;font-size:14px;white-space:nowrap}
  .tab.active{color:var(--ink);border-bottom-color:var(--ink)}

  .error-banner{margin-top:14px;background:var(--red-bg);color:var(--red);padding:10px 12px;border-radius:8px;font-size:13px}

  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:9px 14px;font-size:13.5px;font-weight:600;border:1px solid transparent}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-outline{background:#fff;border-color:var(--line);color:var(--ink-soft)}
  .btn-danger{background:#fff;border-color:var(--line);color:var(--red)}
  .btn-sm{padding:6px 10px;font-size:12.5px}
  .btn-block{width:100%;justify-content:center}
  .btn svg{width:15px;height:15px}

  .dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
  .dash-tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left}
  .dash-tile.active{border-width:1.5px}
  .dash-num{display:block;font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;line-height:1}
  .dash-label{font-size:11px;color:var(--steel)}

  .search-wrap{margin-top:14px}
  #search-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;background:#fff;color:var(--ink)}

  .client-grid{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding-bottom:40px}
  .client-row{display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .client-row-main{flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;background:none;border:none;text-align:left;min-width:0}
  .status-dot{width:11px;height:11px;border-radius:50%;flex:none}
  .client-row-text{display:flex;flex-direction:column;min-width:0;gap:1px}
  .client-row-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .client-row-sub{font-size:12px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .client-row-actions{display:flex;align-items:center;gap:0;padding-right:6px;flex:none;border-left:1px solid var(--line)}
  .client-row-actions button{border:none;background:none;padding:0 9px;height:100%;color:var(--steel)}
  .client-row-actions button:active{background:rgba(0,0,0,.05)}
  .client-row-actions svg{width:16px;height:16px;display:block}

  .tag-card{position:relative;background:#fff;border-radius:6px 16px 16px 6px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(28,35,33,.06);overflow:hidden}
  .tag-bar{position:absolute;left:0;top:0;bottom:0;width:10px}
  .tag-hole{position:absolute;left:13px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line)}
  .tag-main{display:block;width:100%;text-align:left;background:none;border:none;padding:16px 16px 12px 30px}
  .tag-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .tag-eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--steel)}
  .tag-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;color:var(--ink);margin-top:2px}
  .tag-status{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .tag-addr{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--ink-soft)}
  .tag-addr svg{width:14px;height:14px;flex:none;color:var(--steel)}
  .tag-match{margin:0 0 6px;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.5}
  .tag-match.amber{background:var(--amber-bg);color:#8a5c14}
  .tag-match.red{background:var(--red-bg);color:var(--red)}
  .tag-foot{margin:0 16px 16px;padding-top:10px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .tag-date-label{font-size:10px;text-transform:uppercase;color:var(--steel);font-family:'IBM Plex Mono',monospace}
  .tag-date-val{font-size:12.5px;color:var(--ink);font-family:'IBM Plex Mono',monospace}
  .tag-actions{display:flex;gap:2px;flex:none}
  .tag-actions button{border:none;background:none;padding:8px;border-radius:999px;color:var(--steel)}
  .tag-actions button svg{width:16px;height:16px;display:block}
  .tag-actions button:hover{background:rgba(0,0,0,.05)}

  .cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  @media (max-width:760px){.cal-grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:460px){.cal-grid{grid-template-columns:1fr}}
  .cal-month{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .cal-month-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg);font-family:'Oswald',sans-serif;font-weight:600;font-size:13.5px}
  .cal-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel)}
  .cal-month-body{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:36px}
  .cal-row{display:flex;justify-content:space-between;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-left:3px solid;border-radius:6px;padding:6px 8px;font-size:12.5px;width:100%}
  .cal-row-name{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-row-date{color:var(--steel);font-family:'IBM Plex Mono',monospace;font-size:10.5px;flex:none;margin-left:6px}
  .cal-unscheduled{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .cal-unscheduled h3{font-family:'Oswald',sans-serif;font-size:14px;margin:0 0 8px}

  .map-hint{font-size:12px;color:var(--steel);margin-top:10px;line-height:1.5}
  .month-chip-row{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;margin-top:14px;-webkit-overflow-scrolling:touch}
  .month-chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;white-space:nowrap}
  .month-chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  .form-wrap{max-width:680px;margin:0 auto;padding-bottom:60px}
  .back-btn{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:var(--ink-soft);font-size:13px;margin:14px 0}
  .back-btn svg{width:15px;height:15px}
  .form-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:21px;color:var(--ink);margin:6px 0 18px}
  .field{margin-bottom:12px;display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft)}
  .field input,.field textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;color:var(--ink)}
  .field textarea{resize:vertical}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:560px){.field-row{grid-template-columns:1fr}}
  .geocode-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 14px}
  .geocode-status{font-size:12px;color:var(--steel)}

  .apparecchi-section,.photos-section,.signature-section,.payment-section{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  .payment-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:560px){.payment-row{grid-template-columns:1fr}}
  .input-euro{position:relative}
  .input-euro .euro-sign{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--steel);font-weight:700;pointer-events:none}
  .input-euro input{padding-left:28px;width:100%}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .section-head h3{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;color:var(--ink);margin:0}
  .section-actions{display:flex;gap:8px}
  .empty-hint{text-align:center;color:var(--steel);padding:40px 0;font-size:14px}
  .empty-hint-sm{color:var(--steel);font-size:12.5px;margin:4px 0 0}
  .empty-block{grid-column:1/-1;text-align:center;padding:40px 0;color:var(--steel);font-size:14px}

  .app-row{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
  .app-row-badge{font-size:10.5px;font-weight:700;padding:5px 8px;border-radius:999px;white-space:nowrap;text-transform:uppercase}
  .app-row-fields{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media (max-width:560px){.app-row-fields{grid-template-columns:1fr}}
  .app-row select,.app-row input{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:13px;width:100%}
  .app-field{display:flex;flex-direction:column;gap:3px}
  .app-field label{font-size:10px;font-weight:700;color:var(--steel);text-transform:uppercase;letter-spacing:.02em}
  .app-field-highlight{padding:6px;border-radius:8px}
  .app-field-highlight.amber{background:var(--amber-bg)}
  .app-field-highlight.amber select{border-color:var(--amber);font-weight:600}
  .app-field-highlight.red{background:var(--red-bg)}
  .app-field-highlight.red select{border-color:var(--red);font-weight:600}
  .row-remove{border:none;background:transparent;color:var(--red);padding:4px}
  .row-remove svg{width:16px;height:16px;display:block}

  .photo-upload-btn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:8px;padding:9px 14px;font-size:13px;color:var(--ink-soft)}
  .photos-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .photo-thumb{position:relative;width:76px;height:76px}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .photo-thumb button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;border:none;font-size:12px;line-height:1;padding:0}

  .sig-canvas{width:100%;max-width:500px;height:160px;border:1px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block;margin-top:8px}

  .form-actions{display:flex;gap:10px;margin-top:26px}
  .form-actions .btn{flex:1;justify-content:center}

  .detail-wrap{max-width:720px;margin:0 auto;padding-bottom:40px}
  .detail-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
  .detail-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .eyebrow{font-size:11px;text-transform:uppercase;color:var(--steel);margin:0}
  .detail-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:24px;color:var(--ink);margin:2px 0}
  .detail-sub{color:var(--ink-soft);font-size:14px;margin:0}
  .status-pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;list-style:none;padding:0}
  .detail-grid dt{font-size:11px;color:var(--steel);text-transform:uppercase;margin:0}
  .detail-grid dd{margin:2px 0 0;font-size:14px;color:var(--ink)}
  .detail-note{margin-top:14px;background:var(--bg);padding:10px 12px;border-radius:10px;font-size:13.5px;color:var(--ink-soft);white-space:pre-wrap}
  .detail-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .section{margin-top:22px}
  .section h3{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;color:var(--ink);margin:0 0 10px}
  .app-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:600px){.app-grid{grid-template-columns:1fr}}
  .app-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .app-type{font-size:11.5px;color:var(--steel);text-transform:uppercase;margin:0}
  .app-matricola{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink);margin:2px 0 0}
  .app-pos{font-size:13px;color:var(--ink-soft);margin:2px 0 0}
  .app-years{display:flex;gap:8px;margin:8px 0 0;flex-wrap:wrap}
  .app-years span{font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--gray-bg);color:var(--steel);font-family:'IBM Plex Mono',monospace}
  .app-years span.due.amber{background:var(--amber-bg);color:var(--amber);font-weight:600}
  .app-years span.due.red{background:var(--red-bg);color:var(--red);font-weight:600}
  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .photo-view{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .signature-view{max-width:280px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px;display:block}
</style>

const TIPI = ["Polvere ABC","CO2","Schiuma","Idrico","Acqua"];
const MONTHS_IT = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

const STATUS = {
  ok:      { key:'ok',      label:'In regola',      color:'#3D6A5C', bg:'#E4EEE9' },
  presto:  { key:'presto',  label:'In scadenza',     color:'#B9791F', bg:'#F5EAD3' },
  scaduto: { key:'scaduto', label:'Scaduto',         color:'#B8402C', bg:'#F5E1DC' },
  ignoto:  { key:'ignoto',  label:'Da programmare',  color:'#8B9290', bg:'#E9E9E4' },
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function pad2(n){ return String(n).padStart(2,'0'); }
function toISODateLocal(d){
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function addMonths(iso, months){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  d.setMonth(d.getMonth()+months);
  return toISODateLocal(d);
}
function todayISO(){ return toISODateLocal(new Date()); }
function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
function statusOf(nextDate){
  const days = daysUntil(nextDate);
  if(days===null) return STATUS.ignoto;
  if(days<0) return STATUS.scaduto;
  if(days<=30) return STATUS.presto;
  return STATUS.ok;
}
function googleMapsUrl(c){
  if(c.indirizzo) return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(c.indirizzo);
  if(c.lat!=null && c.lng!=null) return 'https://www.google.com/maps/dir/?api=1&destination=' + c.lat + ',' + c.lng;
  return null;
}
function cyclePairLabel(c){
  if(!c.dataUltimaManutenzione) return '—';
  const m1 = new Date(c.dataUltimaManutenzione+'T00:00:00').getMonth();
  const m2 = (m1+6)%12;
  return MONTHS_IT[m1] + ' / ' + MONTHS_IT[m2];
}
function clientOverallStatus(c){
  const y = currentYear();
  const estintori = (c.apparecchi||[]).filter(a => a.categoria==='estintore');
  if(estintori.length===0) return STATUS.ignoto;
  const scadutoOra = estintori.some(a => a.annoScadenza && Number(a.annoScadenza) <= y);
  if(scadutoOra) return STATUS.scaduto;
  const daRevisionare = estintori.some(a => (a.annoRevisione && Number(a.annoRevisione) <= y) || (a.annoScadenza && Number(a.annoScadenza) === y));
  if(daRevisionare) return STATUS.presto;
  return STATUS.ok;
}

/* ---------------- Stato ---------------- */
const state = {
  view: 'list',
  clients: [],
  loading: true,
  error: '',
  query: '',
  filter: 'tutti',
  currentId: null,
  editingId: null,
  draftApparecchi: [],
  draftPhotos: [],
  draftSignature: null,
  draftLatLng: null,
  focusClientId: null,
  mapMonthFilter: null,
};

/* ---------------- Caricamento / persistenza (Firestore) ---------------- */
function initSync(){
  state.loading = true; render();
  clientsCollection.onSnapshot(
    snapshot => {
      state.clients = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      state.loading = false;
      state.error = '';
      render();
    },
    err => {
      state.loading = false;
      state.error = 'Errore di sincronizzazione con il database. Controlla la connessione.';
      render();
    }
  );
}

/* ---------------- Coda di sicurezza locale (localStorage) ---------------- */
const PENDING_KEY = 'estintori_pending_writes';
function getPendingWrites(){
  try{ return JSON.parse(localStorage.getItem(PENDING_KEY) || '{}'); }catch(e){ return {}; }
}
function setPendingWrites(obj){
  try{ localStorage.setItem(PENDING_KEY, JSON.stringify(obj)); }catch(e){}
}
function markPending(full){
  const p = getPendingWrites();
  p[full.id] = full;
  setPendingWrites(p);
}
function clearPending(id){
  const p = getPendingWrites();
  delete p[id];
  setPendingWrites(p);
}
function retryPendingWrites(){
  const p = getPendingWrites();
  Object.keys(p).forEach(id => {
    clientsCollection.doc(id).set(p[id]).then(() => clearPending(id)).catch(()=>{});
  });
}

function persistClient(full){
  // Aggiornamento locale immediato: l'interfaccia non aspetta la rete.
  const idx = state.clients.findIndex(c=>c.id===full.id);
  if(idx>=0) state.clients[idx] = full; else state.clients.push(full);
  state.error = '';
  // Segno il salvataggio come "in sospeso": se la pagina si chiude o si
  // aggiorna prima che il server confermi, al prossimo avvio l'app
  // ritenterà da sola l'invio (vedi retryPendingWrites).
  markPending(full);
  clientsCollection.doc(full.id).set(full).then(() => {
    clearPending(full.id);
  }).catch(err => {
    state.error = 'Sincronizzazione non riuscita: ' + (err && err.message ? err.message : String(err)) + ' — il dato resta salvato su questo dispositivo e riproverò a sincronizzarlo appena possibile.';
    render();
  });
}

async function deleteClient(id){
  if(!confirm('Eliminare questo cliente e tutti i suoi apparecchi? L\'azione non è reversibile.')) return;
  try{
    await clientsCollection.doc(id).delete();
    state.clients = state.clients.filter(c=>c.id!==id);
    state.error = '';
  }catch(e){
    state.error = 'Eliminazione non riuscita. Controlla la connessione e riprova.';
  }
  if(state.currentId===id){ state.currentId=null; state.view='list'; }
  render();
}

/* ---------------- Navigazione ---------------- */
function openDetail(id){
  state.currentId = id; state.view = 'detail'; render();
}

function openForm(id){
  state.editingId = id || null;
  state.draftPhotos = [];
  state.draftApparecchi = [];
  state.draftSignature = null;
  state.draftLatLng = null;
  if(id){
    const detail = state.clients.find(c => c.id === id);
    if(detail){
      state.draftApparecchi = JSON.parse(JSON.stringify(detail.apparecchi||[]));
      state.draftPhotos = JSON.parse(JSON.stringify(detail.foto||[]));
      state.draftSignature = detail.firma || null;
      state.draftLatLng = (detail.lat!=null && detail.lng!=null) ? {lat:detail.lat,lng:detail.lng} : null;
    }
  }
  state.view = 'form';
  render();
}

function setFilter(k){ state.filter = state.filter===k ? 'tutti' : k; updateListDynamic(); }
function handleSearchInput(v){ state.query = v; updateListDynamic(); }

/* ---------------- Geocodifica (OpenStreetMap Nominatim) ---------------- */
async function geocodeIndirizzo(){
  const indirizzo = document.getElementById('f-indirizzo').value.trim();
  if(!indirizzo){ setGeocodeStatus('Inserisci prima un indirizzo.', true); return; }
  setGeocodeStatus('Ricerca posizione in corso…', false);
  try{
    const res = await fetch('https://api.opencagedata.com/geocode/v1/json?key='+OPENCAGE_API_KEY+'&countrycode=it&limit=1&q='+encodeURIComponent(indirizzo));
    const data = await res.json();
    if(data && data.results && data.results[0]){
      const r = data.results[0];
      state.draftLatLng = { lat: r.geometry.lat, lng: r.geometry.lng };
      setGeocodeStatus('Posizione trovata: ' + r.formatted, false);
    }else{
      setGeocodeStatus('Indirizzo non trovato. Puoi salvare comunque, ma non comparirà sulla mappa.', true);
    }
  }catch(e){
    setGeocodeStatus('Geocodifica non riuscita (verifica la connessione).', true);
  }
}
function setGeocodeStatus(msg, isError){
  const el = document.getElementById('geocode-status');
  if(el){ el.textContent = msg; el.style.color = isError ? 'var(--red)' : 'var(--steel)'; }
}
function autoGeocodeInBackground(id, indirizzo){
  if(!indirizzo) return;
  fetch('https://api.opencagedata.com/geocode/v1/json?key='+OPENCAGE_API_KEY+'&countrycode=it&limit=1&q='+encodeURIComponent(indirizzo))
    .then(res => res.json())
    .then(data => {
      if(!data || !data.results || !data.results[0]) return;
      const r = data.results[0];
      const lat = r.geometry.lat, lng = r.geometry.lng;
      const c = state.clients.find(x => x.id === id);
      if(!c) return;
      c.lat = lat; c.lng = lng;
      clientsCollection.doc(id).update({ lat, lng }).catch(()=>{});
      if(state.view==='map') initMap();
    })
    .catch(()=>{});
}

  for(let i=y-20;i<=y+15;i++){
    opts += `<option value="${i}" ${String(selected)===String(i)?'selected':''}>${i}</option>`;
  }
  return opts;
}

/* ---------------- Foto ---------------- */
function compressImage(file, maxW=900, quality=0.6){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h*maxW/w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handlePhotoUpload(input){
  const files = Array.from(input.files || []);
  for(const f of files){
    if(state.draftPhotos.length >= 6){ alert('Massimo 6 foto per cliente (per contenere lo spazio di archiviazione condiviso).'); break; }
    try{ const dataUrl = await compressImage(f); state.draftPhotos.push({id:uid(), dataUrl}); }catch(e){}
  }
  input.value = '';
  renderPhotosList();
}

}

/* ---------------- Firma ---------------- */
let sigCtx=null, sigDrawing=false, sigLast=null;
function initSignaturePad(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  sigCtx = canvas.getContext('2d');
  sigCtx.lineWidth = 2.2; sigCtx.lineCap='round'; sigCtx.strokeStyle = '#1C2321';
  if(state.draftSignature){
    const img = new Image();
    img.onload = () => sigCtx.drawImage(img,0,0,canvas.width,canvas.height);
    img.src = state.draftSignature;
  }
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX-r.left) * (canvas.width/r.width), y: (p.clientY-r.top) * (canvas.height/r.height) };
  }
  function start(e){ sigDrawing=true; sigLast=pos(e); e.preventDefault(); }
  function move(e){
    if(!sigDrawing) return;
    const p = pos(e);
    sigCtx.beginPath(); sigCtx.moveTo(sigLast.x, sigLast.y); sigCtx.lineTo(p.x, p.y); sigCtx.stroke();
    sigLast = p; e.preventDefault();
  }
  function end(){ if(sigDrawing){ sigDrawing=false; state.draftSignature = canvas.toDataURL('image/png'); } }
  canvas.onmousedown = start; canvas.onmousemove = move; window.addEventListener('mouseup', end);
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}
function clearSignature(){
  const canvas = document.getElementById('sig-canvas');
  if(canvas && sigCtx) sigCtx.clearRect(0,0,canvas.width,canvas.height);
  state.draftSignature = null;
}

function autoNextDate(){
  const ultima = document.getElementById('f-ultima').value;
  const prossimaEl = document.getElementById('f-prossima');
  if(ultima) prossimaEl.value = addMonths(ultima, 6);
}
function collectFormData(){
  const id = state.editingId || uid();
  const existing = state.clients.find(c => c.id === id);
  const prevLat = existing ? existing.lat : null;
  const prevLng = existing ? existing.lng : null;
  return {
    id,
    nome: document.getElementById('f-nome').value.trim(),
    indirizzo: document.getElementById('f-indirizzo').value.trim(),
    telefono: document.getElementById('f-telefono').value.trim(),
    note: document.getElementById('f-note').value.trim(),
    dataUltimaManutenzione: document.getElementById('f-ultima').value,
    dataProssimaManutenzione: document.getElementById('f-prossima').value,
    lat: state.draftLatLng ? state.draftLatLng.lat : prevLat,
    lng: state.draftLatLng ? state.draftLatLng.lng : prevLng,
    apparecchi: state.draftApparecchi,
    foto: state.draftPhotos,
    firma: state.draftSignature,
    firmaData: state.draftSignature ? todayISO() : (existing ? existing.firmaData : null),
    importo: document.getElementById('f-importo').value.trim(),
    statoPagamento: document.getElementById('f-stato-pagamento').value,
  };
}
async function saveClientForm(e){
  if(e && typeof e.preventDefault === 'function') e.preventDefault();
  const nomeEl = document.getElementById('f-nome');
  const nome = nomeEl ? nomeEl.value.trim() : '';
  if(!nome){ alert('Inserisci il nome del cliente.'); return; }
  const btn = document.getElementById('save-client-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Salvataggio…'; }
  try{
    const full = collectFormData();
    persistClient(full);
    if(full.indirizzo && (full.lat==null || full.lng==null)){
      autoGeocodeInBackground(full.id, full.indirizzo);
    }
    state.view = 'list';
    state.editingId = null;
    render();
  }catch(err){
    state.error = 'Errore imprevisto durante il salvataggio: ' + (err && err.message ? err.message : err);
    render();
  }
}
async function saveAndGenerateInterventoPDF(e){
  if(e && typeof e.preventDefault === 'function') e.preventDefault();
  const nomeEl = document.getElementById('f-nome');
  const nome = nomeEl ? nomeEl.value.trim() : '';
  if(!nome){ alert('Inserisci il nome del cliente.'); return; }

/* ---------------- Generazione PDF ---------------- */
function generateInterventoPDF(c){
  if(typeof window.jspdf === 'undefined'){ alert('Libreria PDF non disponibile: verifica la connessione e riprova.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const marginX = 16, maxW = 178;
  let y = drawCompanyHeader(doc, marginX, maxW);

  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Rapporto intervento — Manutenzione estintori', marginX, y); y += 8;
  doc.setDrawColor(210); doc.line(marginX, y, 194, y); y += 8;

  doc.setFontSize(12); doc.setFont('helvetica','bold');
  doc.text(c.nome || '—', marginX, y); y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  [
    'Indirizzo: ' + (c.indirizzo || '—'),
    'Telefono: ' + (c.telefono || '—'),
    'Data intervento: ' + fmtDate(todayISO()),
  ].forEach(line => { doc.text(line, marginX, y); y += 5.2; });
  y += 3;

  const estintori = (c.apparecchi||[]).filter(a=>a.categoria==='estintore');
  const altro = (c.apparecchi||[]).filter(a=>a.categoria==='altro');

  doc.setFont('helvetica','bold'); doc.text('Estintori', marginX, y); y += 6;
  doc.setFont('helvetica','normal');
  if(estintori.length===0){ doc.text('Nessuno registrato.', marginX, y); y += 6; }
  estintori.forEach(a=>{
    const line = '• ' + (a.tipo||'') + ' — ' + (a.matricola||'s.n.') + ' — ' + (a.posizione||'') + (a.capacita? ' ('+a.capacita+')':'');
    const lines = doc.splitTextToSize(line, maxW);
    if(y + lines.length*5 > 265){ doc.addPage(); y=20; }
    doc.text(lines, marginX, y); y += lines.length*5 + 1;
  });
  y += 3;

  if(altro.length){
    doc.setFont('helvetica','bold'); doc.text('Altro', marginX, y); y += 6;
    doc.setFont('helvetica','normal');
    altro.forEach(a=>{
      const line = '• ' + (a.nome||'') + ' — ' + (a.note||'');
      const lines = doc.splitTextToSize(line, maxW);
      if(y + lines.length*5 > 265){ doc.addPage(); y=20; }
      doc.text(lines, marginX, y); y += lines.length*5 + 1;
    });
    y += 3;
  }

  if(c.note){
    if(y > 250){ doc.addPage(); y=20; }
    doc.setFont('helvetica','bold'); doc.text('Note', marginX, y); y += 6;
    doc.setFont('helvetica','normal');
    const lines = doc.splitTextToSize(c.note, maxW);
    doc.text(lines, marginX, y); y += lines.length*5 + 4;
  }

  if(y > 245){ doc.addPage(); y=20; }
  doc.setDrawColor(210); doc.line(marginX, y, 194, y); y += 8;
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('Pagamento', marginX, y); y += 8;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  const importoTxt = c.importo ? ('€ ' + Number(c.importo).toFixed(2).replace('.', ',')) : 'Non specificato';
  const statoTxt = c.statoPagamento === 'pagato' ? 'PAGATO' : (c.statoPagamento === 'da_pagare' ? 'DA PAGARE' : 'Non specificato');
  doc.text('Importo: ' + importoTxt, marginX, y); y += 6;
  doc.setFont('helvetica','bold');
  doc.text('Stato: ' + statoTxt, marginX, y); y += 10;

  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Firma cliente', marginX, y); y += 6;
  if(c.firma){
    try{ doc.addImage(c.firma, 'PNG', marginX, y, 60, 20); }catch(e){}
    y += 24;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text('Firmato il ' + fmtDate(c.firmaData || todayISO()), marginX, y);
  }else{
    doc.setFont('helvetica','normal');
    doc.text('Non firmato.', marginX, y);
  }

  const fname = 'intervento-' + (c.nome||'cliente').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + todayISO() + '.pdf';
  const blob = doc.output('blob');
  const file = new File([blob], fname, { type: 'application/pdf' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    navigator.share({
      files: [file],
      title: 'Rapporto intervento – ' + (c.nome||''),
      text: 'Rapporto intervento manutenzione estintori',
    }).catch(()=>{ doc.save(fname); });
  }else{
    doc.save(fname);
  }
}

    estintori.forEach(a=>{
      const line = '• ' + (a.tipo||'') + ' — ' + (a.matricola||'s.n.') + ' — ' + (a.posizione||'') + (a.capacita? ' ('+a.capacita+')':'')
        + (a.annoProduzione? ' — produzione '+a.annoProduzione:'') + (a.annoRevisione? ' — revisione '+a.annoRevisione:'') + (a.annoScadenza? ' — scadenza '+a.annoScadenza:'');
      const lines = doc.splitTextToSize(line, maxW);
      if(y + lines.length*5 > 275){ doc.addPage(); y=20; }
      doc.text(lines, marginX, y); y += lines.length*5 + 1;
    });
    y += 3;

    doc.setFont('helvetica','bold'); doc.text('Altro', marginX, y); y += 6;
    doc.setFont('helvetica','normal');
    if(altro.length===0){ doc.text('Nessun elemento registrato.', marginX, y); y += 6; }
    altro.forEach(a=>{
      const line = '• ' + (a.nome||'') + ' — ' + (a.note||'');
      const lines = doc.splitTextToSize(line, maxW);
      if(y + lines.length*5 > 275){ doc.addPage(); y=20; }
      doc.text(lines, marginX, y); y += lines.length*5 + 1;
    });

    if(c.note){
      y += 3;
      if(y > 260){ doc.addPage(); y = 20; }
      doc.setFont('helvetica','bold'); doc.text('Note', marginX, y); y += 6;
      doc.setFont('helvetica','normal');
      const lines = doc.splitTextToSize(c.note, maxW);
      doc.text(lines, marginX, y); y += lines.length*5;
    }
  });

  const fname = 'registro-clienti-completo-' + todayISO() + '.pdf';
  const blob = doc.output('blob');
  const file = new File([blob], fname, { type:'application/pdf' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    navigator.share({ files:[file], title:'Registro clienti completo', text:'Backup cartaceo di tutti i clienti' }).catch(()=>{ doc.save(fname); });
  }else{
    doc.save(fname);
  }
}

/* ---------------- Vista: Elenco ---------------- */
function currentYear(){ return new Date().getFullYear(); }
function countByYearField(field, year){
  let n = 0;
  state.clients.forEach(c => (c.apparecchi||[]).forEach(a => {
    if(a.categoria==='estintore' && String(a[field])===String(year)) n++;
  }));
  return n;
}
function dashTilesHtml(){
  const y = currentYear();
  let totEstintori = 0;
  state.clients.forEach(c => (c.apparecchi||[]).forEach(a => { if(a.categoria==='estintore') totEstintori++; }));
  const tiles = [
    ['tutti','Clienti', state.clients.length, '#1C2321'],
    ['revisione',`Da revisionare · ${y}`, countByYearField('annoRevisione', y), '#B9791F'],
    ['scadenza',`Scadenze · ${y}`, countByYearField('annoScadenza', y), '#B8402C'],
    ['estintori','Estintori totali', totEstintori, '#3D6A5C'],
  ];
  return tiles.map(([k,label,val,color]) => `
    <button class="dash-tile ${state.filter===k?'active':''}" style="border-color:${state.filter===k?color:'var(--line)'}" onclick="setFilter('${k}')">
      <span class="dash-num" style="color:${color}">${val||0}</span>
      <span class="dash-label">${label}</span>
    </button>`).join('');
}
function filteredClients(){
  const y = currentYear();
  let list = state.clients;
  if(state.filter==='revisione'){
    list = list.filter(c => (c.apparecchi||[]).some(a => a.categoria==='estintore' && String(a.annoRevisione)===String(y)));
  }else if(state.filter==='scadenza'){
    list = list.filter(c => (c.apparecchi||[]).some(a => a.categoria==='estintore' && String(a.annoScadenza)===String(y)));
  }else if(state.filter==='estintori'){
    list = list.filter(c => (c.apparecchi||[]).some(a => a.categoria==='estintore'));
  }
  if(state.query.trim()){
    const q = state.query.trim().toLowerCase();
    list = list.filter(c => (c.nome||'').toLowerCase().includes(q) || (c.indirizzo||'').toLowerCase().includes(q));
  }
  if(state.filter==='revisione' || state.filter==='scadenza'){
    return [...list].sort((a,b) => (a.nome||'').localeCompare(b.nome||''));
  }
  return [...list].sort((a,b)=>{
    const da = daysUntil(a.dataProssimaManutenzione), db = daysUntil(b.dataProssimaManutenzione);
    if(da===null) return 1; if(db===null) return -1; return da-db;
  });
}
function clientTag(c){
  const s = clientOverallStatus(c);
  let matchExtra = '';
  if(state.filter==='revisione' || state.filter==='scadenza'){
    const y = currentYear();
    const field = state.filter==='revisione' ? 'annoRevisione' : 'annoScadenza';
    const cls = state.filter==='revisione' ? 'amber' : 'red';
    const matches = (c.apparecchi||[]).filter(a => a.categoria==='estintore' && String(a[field])===String(y));
    if(matches.length){
      matchExtra = `<div class="tag-match ${cls}">${matches.map(a=>escapeHtml(a.tipo||'Estintore')+(a.matricola?' · '+escapeHtml(a.matricola):'')).join('<br>')}</div>`;
    }
  }
  return `
  ${matchExtra}
  <div class="client-row">
    <button class="client-row-main" onclick="openForm('${c.id}')">
      <span class="status-dot" style="background:${s.color}" title="${s.label}"></span>
      <span class="client-row-text">
        <span class="client-row-name">${escapeHtml(c.nome)}</span>
        <span class="client-row-sub">${escapeHtml(c.indirizzo)||'Indirizzo non indicato'}</span>
      </span>
    </button>
    <div class="client-row-actions">
      <button title="Vedi sulla mappa" onclick="openOnMap('${c.id}')">${ICON_PIN}</button>
      <button title="Vedi scheda" onclick="openDetail('${c.id}')">${ICON_EYE}</button>
      <button title="Elimina" onclick="deleteClient('${c.id}')">${ICON_TRASH}</button>
    </div>
  </div>`;
}
function clientGridHtml(){
  if(state.loading) return '<p class="empty-hint">Caricamento…</p>';
  const list = filteredClients();
  if(list.length===0){
    return `<div class="empty-block">${state.clients.length===0 ? "Nessun cliente registrato. Aggiungi il primo per iniziare." : "Nessun cliente corrisponde ai filtri attuali."}</div>`;
  }
  return list.map(clientTag).join('');
}
function updateListDynamic(){
  const dash = document.getElementById('dash-grid');
  const grid = document.getElementById('client-grid');
  if(dash) dash.innerHTML = dashTilesHtml();
  if(grid) grid.innerHTML = clientGridHtml();
}
function renderList(){
  return `
    <div id="dash-grid" class="dash-grid">${dashTilesHtml()}</div>
    <div class="search-wrap">
      <input id="search-input" value="${escapeHtml(state.query)}" oninput="handleSearchInput(this.value)" placeholder="Cerca cliente o indirizzo…" />
    </div>
    <button class="btn btn-outline btn-block" onclick="generateFullPDF()" style="margin-top:10px">${ICON_PRINTER} Stampa / esporta elenco completo (backup cartaceo)</button>
    <div id="client-grid" class="client-grid">${clientGridHtml()}</div>
  `;
}

/* ---------------- Vista: Calendario ---------------- */
function calClientRow(c){
  const s = statusOf(c.dataProssimaManutenzione);
  return `<button class="cal-row" style="border-left-color:${s.color}" onclick="openDetail('${c.id}')">
    <span class="cal-row-name">${escapeHtml(c.nome)}</span>
    <span class="cal-row-date">${fmtDate(c.dataProssimaManutenzione)}</span>
  </button>`;
}
function renderCalendar(){
  const buckets = Array.from({length:12}, () => []);
  const senzaData = [];
  state.clients.forEach(c=>{
    if(!c.dataProssimaManutenzione){ senzaData.push(c); return; }
    const m = new Date(c.dataProssimaManutenzione+'T00:00:00').getMonth();
    buckets[m].push(c);
  });
  const months = MONTHS_IT.map((name, i) => {
    const list = buckets[i].sort((a,b)=> a.dataProssimaManutenzione < b.dataProssimaManutenzione ? -1 : 1);
    return `<div class="cal-month">
      <div class="cal-month-head"><span>${name}</span><span class="cal-count">${list.length}</span></div>
      <div class="cal-month-body">${list.length ? list.map(calClientRow).join('') : '<p class="empty-hint-sm">Nessun cliente</p>'}</div>
    </div>`;
  }).join('');
  const unscheduled = senzaData.length
    ? `<div class="cal-unscheduled"><h3>Senza data di manutenzione</h3>${senzaData.map(calClientRow).join('')}</div>`
    : '';
  return `<div class="cal-grid">${months}</div>${unscheduled}`;
}

/* ---------------- Vista: Mappa ---------------- */
let leafletMap = null;
function renderMap(){
  const y = currentYear();
  const monthButtons = MONTHS_IT.map((name,i) => `
    <button class="month-chip ${state.mapMonthFilter===i?'active':''}" onclick="setMapMonthFilter(${i})">${name.slice(0,3)}</button>`).join('');
  return `
    <div class="month-chip-row">
      <button class="month-chip ${state.mapMonthFilter===null?'active':''}" onclick="setMapMonthFilter(null)">Tutti</button>
      ${monthButtons}
    </div>
    <div id="map-container" style="height:60vh;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:10px;"></div>
    <p class="map-hint">Le posizioni vengono calcolate dall'indirizzo inserito nella scheda cliente tramite geocodifica OpenCage. Se un pallino è nel posto sbagliato, <strong>tienilo premuto e trascinalo</strong> nella posizione corretta: si salva da solo. Il filtro sopra mostra solo i clienti con prossima manutenzione in quel mese (anno ${y}).</p>`;
}
function statusDivIcon(color){
  return L.divIcon({
    className: '',
    html: `<div style="width:20px;height:20px;border-radius:50%;background:${color};border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>`,
    iconSize: [20,20],
    iconAnchor: [10,10],
    popupAnchor: [0,-10],
  });
}
function setMapMonthFilter(m){
  state.mapMonthFilter = m;
  render();
}
function updateClientLatLng(id, lat, lng){
  const c = state.clients.find(x=>x.id===id);
  if(c){ c.lat = lat; c.lng = lng; }
  clientsCollection.doc(id).update({ lat, lng }).catch(()=>{});
}
function initMap(){
  const container = document.getElementById('map-container');
  if(!container || typeof L==='undefined') return;
  if(leafletMap){ leafletMap.remove(); leafletMap=null; }
  leafletMap = L.map('map-container').setView([42.5, 12.5], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
  }).addTo(leafletMap);
  let pts = state.clients.filter(c => c.lat!=null && c.lng!=null);
  if(state.mapMonthFilter!==null){
    pts = pts.filter(c => c.dataProssimaManutenzione && new Date(c.dataProssimaManutenzione+'T00:00:00').getMonth()===state.mapMonthFilter);
  }
  if(pts.length===0) return;
  const bounds = [];
  const markersById = {};
  pts.forEach(c=>{
    const s = clientOverallStatus(c);
    const marker = L.marker([c.lat, c.lng], { icon: statusDivIcon(s.color), draggable: true }).addTo(leafletMap);
    const navUrl = googleMapsUrl(c);
    marker.bindPopup(`<strong>${escapeHtml(c.nome)}</strong><br>${escapeHtml(c.indirizzo||'')}<br>
      <a href="#" onclick="openDetail('${c.id}');return false;">Apri scheda</a>
      ${navUrl ? ` · <a href="${navUrl}" target="_blank" rel="noopener">Naviga (Google Maps)</a>` : ''}
      <br><span style="font-size:11px;color:#8B9290">Tieni premuto e trascina per correggere la posizione</span>`);
    marker.on('dragend', () => {
      const pos = marker.getLatLng();
      updateClientLatLng(c.id, pos.lat, pos.lng);
      marker.bindPopup(`<strong>${escapeHtml(c.nome)}</strong><br>Posizione aggiornata ✓`).openPopup();
    });
    markersById[c.id] = marker;
    bounds.push([c.lat, c.lng]);
  });
  if(state.focusClientId && markersById[state.focusClientId]){
    const fc = state.clients.find(x=>x.id===state.focusClientId);
    leafletMap.setView([fc.lat, fc.lng], 16);
    markersById[state.focusClientId].openPopup();
    state.focusClientId = null;
  }else if(bounds.length){
    leafletMap.fitBounds(bounds, { padding:[40,40], maxZoom: 15 });
  }
}
function openOnMap(id){
  const c = state.clients.find(x=>x.id===id);
  if(!c || c.lat==null || c.lng==null){
    alert('Nessuna posizione salvata per questo cliente ancora. Riprova tra poco (la geocodifica automatica può richiedere qualche secondo) oppure apri "Modifica scheda" e usa "Verifica posizione ora".');
    return;
  }
  state.mapMonthFilter = null;
  state.focusClientId = id;
  state.view = 'map';
  render();
}

      </div>
      <button type="button" id="save-pdf-btn" class="btn btn-block" style="margin-top:10px;background:var(--teal);color:#fff" onclick="saveAndGenerateInterventoPDF(event)">${ICON_PRINTER} Salva e genera PDF intervento</button>
      <p class="empty-hint-sm" style="margin-top:6px">Salva la scheda e crea subito un PDF con importo e firma: una volta generato non è più modificabile, così i dati di pagamento restano al sicuro. Da lì potrai inviarlo direttamente.</p>
    </form>
  </div>`;
}

/* ---------------- Layout generale ---------------- */
function headerHtml(){
  return `
  <header class="topbar">
    <div class="topbar-inner container">
      <div class="brand">
        <div class="brand-badge"><img src="${ICON_BADGE_SRC}" alt="Icona estintore" /></div>
        <div>
          <p class="brand-title">Registro Clienti · Estintori <span style="font-size:10px;color:var(--steel);font-weight:400">build 17</span></p>
        </div>
      </div>
      ${state.view!=='form' ? `<button class="btn btn-primary btn-sm" onclick="openForm(null)">${ICON_PLUS} Nuovo cliente</button>` : ''}
    </div>
    ${state.view!=='form' ? `
    <nav class="tabs container">
      <button class="tab ${state.view==='list'?'active':''}" onclick="state.view='list';render();">Elenco</button>
      <button class="tab ${state.view==='calendar'?'active':''}" onclick="state.view='calendar';render();">Calendario</button>
      <button class="tab ${state.view==='map'?'active':''}" onclick="state.view='map';render();">Mappa</button>
    </nav>` : ''}
  </header>
  ${state.error ? `<div class="container"><div class="error-banner">${escapeHtml(state.error)}</div></div>` : ''}
  `;
}
function bodyHtml(){
  if(state.view==='list') return `<main class="container">${renderList()}</main>`;
  if(state.view==='calendar') return `<main class="container">${renderCalendar()}</main>`;
  if(state.view==='map') return `<main class="container">${renderMap()}</main>`;
  if(state.view==='form') return `<main class="container">${renderForm()}</main>`;
  if(state.view==='detail') return `<main class="container">${renderDetail()}</main>`;
  return '';
}
function render(){
  try{
    document.getElementById('app').innerHTML = headerHtml() + bodyHtml();
    if(state.view==='form'){
      renderApparecchiList();
      renderPhotosList();
      setTimeout(initSignaturePad, 0);
    }
    if(state.view==='map'){
      setTimeout(initMap, 30);
    }
  }catch(err){
    const app = document.getElementById('app');
    const details = (err && err.stack) ? err.stack : String(err);
    if(app){
      app.innerHTML = '<div style="padding:20px;font-family:monospace;white-space:pre-wrap;font-size:12px;background:#fdeceb;color:#8a2c1f;min-height:100vh;">ERRORE DI VISUALIZZAZIONE\n\nFai uno screenshot di questo testo e mandalo:\n\n' + details.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</div>';
    }
  }
}

window.addEventListener('error', ev => {
  state.error = 'Errore JavaScript: ' + (ev.message || 'sconosciuto');
  try{ render(); }catch(e){}
});
window.addEventListener('unhandledrejection', ev => {
  const reason = ev.reason;
  state.error = 'Errore imprevisto: ' + (reason && reason.message ? reason.message : String(reason));
  try{ render(); }catch(e){}
});

initSync();
retryPendingWrites();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
