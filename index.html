  ok:      { key:'ok',      label:'In regola',      color:'#3D6A5C', bg:'#E4EEE9' },

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function addMonths(iso, months){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  d.setMonth(d.getMonth()+months);
  return d.toISOString().slice(0,10);
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
function statusOf(nextDate){
  const days = daysUntil(nextDate);
  if(days===null) return STATUS.ignoto;
  if(days<0) return STATUS.scaduto;
  if(days<=30) return STATUS.presto;
  return STATUS.ok;
}
function cyclePairLabel(c){
  if(!c.dataUltimaManutenzione) return '—';
  const m1 = new Date(c.dataUltimaManutenzione+'T00:00:00').getMonth();
  const m2 = (m1+6)%12;
  return MONTHS_IT[m1] + ' / ' + MONTHS_IT[m2];
}

};

/* ---------------- Caricamento / persistenza ---------------- */
async function loadIndex(){
  state.loading = true; render();
  try{
    const res = await window.storage.get(STORAGE_INDEX, true);
    state.clients = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    state.clients = [];
  }
  state.loading = false;
  render();
}

async function persistClient(full){
  try{
    const setRes = await window.storage.set('cliente:'+full.id, JSON.stringify(full), true);
    if(!setRes) throw new Error('set failed');
    state.detailCache[full.id] = full;
    const lightweight = {
      id: full.id, nome: full.nome, indirizzo: full.indirizzo,
      lat: full.lat, lng: full.lng, telefono: full.telefono, note: full.note,
      dataUltimaManutenzione: full.dataUltimaManutenzione,
      dataProssimaManutenzione: full.dataProssimaManutenzione,
      apparecchi: full.apparecchi || [],
      numApparecchi: (full.apparecchi||[]).length,
    };
    const idx = state.clients.findIndex(c=>c.id===full.id);
    if(idx>=0) state.clients[idx]=lightweight; else state.clients.push(lightweight);
    await window.storage.set(STORAGE_INDEX, JSON.stringify(state.clients), true);
    state.error = '';
  }catch(err){
    state.error = 'Salvataggio non riuscito. Controlla la connessione e riprova.';
  }
}

async function deleteClient(id){
  if(!confirm('Eliminare questo cliente e tutti i suoi apparecchi? L\'azione non è reversibile.')) return;
  try{ await window.storage.delete('cliente:'+id, true); }catch(e){}
  delete state.detailCache[id];
  state.clients = state.clients.filter(c=>c.id!==id);
  try{ await window.storage.set(STORAGE_INDEX, JSON.stringify(state.clients), true); }catch(e){}
  if(state.currentId===id){ state.currentId=null; state.view='list'; }
  render();
}

async function fetchDetailAndRerender(id){
  try{
    const res = await window.storage.get('cliente:'+id, true);
    state.detailCache[id] = res && res.value ? JSON.parse(res.value) : {id, nome:'(scheda non trovata)', apparecchi:[]};
  }catch(e){
    state.detailCache[id] = {id, nome:'(errore di caricamento)', apparecchi:[]};
  }
  if(state.view==='detail' && state.currentId===id) render();
}

/* ---------------- Navigazione ---------------- */
async function openDetail(id){
  state.currentId = id; state.view = 'detail'; render();
  if(!state.detailCache[id]) await fetchDetailAndRerender(id);
}

async function openForm(id){
  state.editingId = id || null;
  state.draftPhotos = [];
  state.draftApparecchi = [];
  state.draftSignature = null;
  state.draftLatLng = null;
  if(id){
    let detail = state.detailCache[id];
    if(!detail){
      try{
        const res = await window.storage.get('cliente:'+id, true);
        detail = res && res.value ? JSON.parse(res.value) : null;
        if(detail) state.detailCache[id]=detail;
      }catch(e){}
    }
    if(detail){
      state.draftApparecchi = JSON.parse(JSON.stringify(detail.apparecchi||[]));
      state.draftPhotos = JSON.parse(JSON.stringify(detail.foto||[]));
      state.draftSignature = detail.firma || null;
      state.draftLatLng = (detail.lat!=null && detail.lng!=null) ? {lat:detail.lat,lng:detail.lng} : null;
    }
  }
  state.view = 'form';
  render();
}

async function geocodeIndirizzo(){
  const indirizzo = document.getElementById('f-indirizzo').value.trim();
  if(!indirizzo){ setGeocodeStatus('Inserisci prima un indirizzo.', true); return; }
  setGeocodeStatus('Ricerca posizione in corso…', false);
  try{
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(indirizzo));
    const data = await res.json();
    if(data && data[0]){
      state.draftLatLng = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      setGeocodeStatus('Posizione trovata sulla mappa.', false);
    }else{
      setGeocodeStatus('Indirizzo non trovato. Puoi salvare comunque, ma non comparirà sulla mappa.', true);
    }
  }catch(e){
    setGeocodeStatus('Geocodifica non riuscita (verifica la connessione).', true);
  }
}

/* ---------------- Foto ---------------- */
function compressImage(file, maxW=900, quality=0.6){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h*maxW/w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handlePhotoUpload(input){
  const files = Array.from(input.files || []);
  for(const f of files){
    if(state.draftPhotos.length >= 6){ alert('Massimo 6 foto per cliente (per contenere lo spazio di archiviazione condiviso).'); break; }
    try{ const dataUrl = await compressImage(f); state.draftPhotos.push({id:uid(), dataUrl}); }catch(e){}
  }

/* ---------------- Firma ---------------- */
let sigCtx=null, sigDrawing=false, sigLast=null;
function initSignaturePad(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  sigCtx = canvas.getContext('2d');
  sigCtx.lineWidth = 2.2; sigCtx.lineCap='round'; sigCtx.strokeStyle = '#1C2321';
  if(state.draftSignature){
    const img = new Image();
    img.onload = () => sigCtx.drawImage(img,0,0,canvas.width,canvas.height);
    img.src = state.draftSignature;
  }
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX-r.left) * (canvas.width/r.width), y: (p.clientY-r.top) * (canvas.height/r.height) };
  }
  function start(e){ sigDrawing=true; sigLast=pos(e); e.preventDefault(); }
  function move(e){
    if(!sigDrawing) return;
    const p = pos(e);
    sigCtx.beginPath(); sigCtx.moveTo(sigLast.x, sigLast.y); sigCtx.lineTo(p.x, p.y); sigCtx.stroke();
    sigLast = p; e.preventDefault();
  }
  function end(){ if(sigDrawing){ sigDrawing=false; state.draftSignature = canvas.toDataURL('image/png'); } }
  canvas.onmousedown = start; canvas.onmousemove = move; window.addEventListener('mouseup', end);
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}
function clearSignature(){
  const canvas = document.getElementById('sig-canvas');
  if(canvas && sigCtx) sigCtx.clearRect(0,0,canvas.width,canvas.height);
  state.draftSignature = null;
}

/* ---------------- Generazione PDF ---------------- */
function generatePDF(id){
  const c = state.detailCache[id];
  if(!c){ alert('Apri prima la scheda del cliente.'); return; }
  if(typeof window.jspdf === 'undefined'){ alert('Libreria PDF non disponibile: verifica la connessione e riprova.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const marginX = 16, maxW = 178;
  let y = 20;

  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Scheda cliente — Manutenzione estintori', marginX, y); y += 8;
  doc.setDrawColor(210); doc.line(marginX, y, 194, y); y += 8;

  doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text(c.nome || '—', marginX, y); y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  [
    'Indirizzo: ' + (c.indirizzo || '—'),
    'Telefono: ' + (c.telefono || '—'),
    'Ultima manutenzione: ' + fmtDate(c.dataUltimaManutenzione),
    'Prossima manutenzione: ' + fmtDate(c.dataProssimaManutenzione),
    'Ciclo mensile: ' + cyclePairLabel(c),
  ].forEach(line => { doc.text(line, marginX, y); y += 5.2; });
  y += 3;

  const estintori = (c.apparecchi||[]).filter(a=>a.categoria==='estintore');
  const altro = (c.apparecchi||[]).filter(a=>a.categoria==='altro');

  doc.setFont('helvetica','bold'); doc.text('Estintori', marginX, y); y += 6;
  doc.setFont('helvetica','normal');
  if(estintori.length===0){ doc.text('Nessuno registrato.', marginX, y); y += 6; }
  estintori.forEach(a=>{
    const line = '• ' + (a.tipo||'') + ' — ' + (a.matricola||'s.n.') + ' — ' + (a.posizione||'') + (a.capacita? ' ('+a.capacita+')':'')
      + (a.annoProduzione? ' — produzione '+a.annoProduzione:'') + (a.annoRevisione? ' — revisione '+a.annoRevisione:'') + (a.annoScadenza? ' — scadenza '+a.annoScadenza:'');
    const lines = doc.splitTextToSize(line, maxW);
    if(y + lines.length*5 > 275){ doc.addPage(); y=20; }
    doc.text(lines, marginX, y); y += lines.length*5 + 1;
  });
  y += 3;

  doc.setFont('helvetica','bold'); doc.text('Altro', marginX, y); y += 6;
  doc.setFont('helvetica','normal');
  if(altro.length===0){ doc.text('Nessun elemento registrato.', marginX, y); y += 6; }
  altro.forEach(a=>{
    const line = '• ' + (a.nome||'') + ' — ' + (a.note||'');
    const lines = doc.splitTextToSize(line, maxW);
    if(y + lines.length*5 > 275){ doc.addPage(); y=20; }
    doc.text(lines, marginX, y); y += lines.length*5 + 1;
  });
  y += 3;

  if(c.note){
    if(y > 260){ doc.addPage(); y=20; }
    doc.setFont('helvetica','bold'); doc.text('Note', marginX, y); y += 6;
    doc.setFont('helvetica','normal');
    const lines = doc.splitTextToSize(c.note, maxW);
    doc.text(lines, marginX, y); y += lines.length*5 + 4;
  }

  if(c.foto && c.foto.length){
    if(y > 220) { doc.addPage(); y=20; }
    doc.setFont('helvetica','bold'); doc.text('Foto', marginX, y); y += 6;
    let x = marginX;
    c.foto.slice(0,6).forEach((p, idx) => {
      try{ doc.addImage(p.dataUrl, 'JPEG', x, y, 40, 30); }catch(e){}
      x += 44;
      if((idx+1)%4===0){ x = marginX; y += 34; }
    });
    y += 36;
  }

  if(y > 250){ doc.addPage(); y=20; }
  doc.setFont('helvetica','bold'); doc.text('Firma cliente', marginX, y); y += 6;
  if(c.firma){
    try{ doc.addImage(c.firma, 'PNG', marginX, y, 60, 20); }catch(e){}
    y += 24;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text('Firmato il ' + fmtDate(c.firmaData), marginX, y);
  }else{
    doc.setFont('helvetica','normal');
    doc.text('Non firmato.', marginX, y);
  }

  const fname = 'scheda-' + (c.nome||'cliente').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.pdf';
  const blob = doc.output('blob');
  const file = new File([blob], fname, { type: 'application/pdf' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    navigator.share({
      files: [file],
      title: 'Scheda cliente – ' + (c.nome||''),
      text: 'Scheda manutenzione estintori: ' + (c.nome||''),
    }).catch(()=>{ doc.save(fname); });
  } else {
    doc.save(fname);
  }
}

  const y = currentYear();
  let totEstintori = 0;
  state.clients.forEach(c => (c.apparecchi||[]).forEach(a => { if(a.categoria==='estintore') totEstintori++; }));
  const tiles = [
    ['tutti','Clienti', state.clients.length, '#1C2321'],
    ['revisione',`Da revisionare · ${y}`, countByYearField('annoRevisione', y), '#B9791F'],
    ['scadenza',`Scadenze · ${y}`, countByYearField('annoScadenza', y), '#B8402C'],
    ['estintori','Estintori totali', totEstintori, '#3D6A5C'],
  ];
  return tiles.map(([k,label,val,color]) => `
    <button class="dash-tile ${state.filter===k?'active':''}" style="border-color:${state.filter===k?color:'var(--line)'}" onclick="setFilter('${k}')">
      <span class="dash-num" style="color:${color}">${val||0}</span>
      <span class="dash-label">${label}</span>
    </button>`).join('');
}
function filteredClients(){
  const y = currentYear();
  let list = state.clients;
  if(state.filter==='revisione'){
    list = list.filter(c => (c.apparecchi||[]).some(a => a.categoria==='estintore' && String(a.annoRevisione)===String(y)));
  }else if(state.filter==='scadenza'){
    list = list.filter(c => (c.apparecchi||[]).some(a => a.categoria==='estintore' && String(a.annoScadenza)===String(y)));
  }else if(state.filter==='estintori'){
    list = list.filter(c => (c.apparecchi||[]).some(a => a.categoria==='estintore'));
  }
  if(state.query.trim()){
    const q = state.query.trim().toLowerCase();
    list = list.filter(c => (c.nome||'').toLowerCase().includes(q) || (c.indirizzo||'').toLowerCase().includes(q));
  }
  if(state.filter==='revisione' || state.filter==='scadenza'){
    return [...list].sort((a,b) => (a.nome||'').localeCompare(b.nome||''));
  }
  return [...list].sort((a,b)=>{
    const da = daysUntil(a.dataProssimaManutenzione), db = daysUntil(b.dataProssimaManutenzione);
    if(da===null) return 1; if(db===null) return -1; return da-db;
  });
}
function clientTag(c){
  const s = statusOf(c.dataProssimaManutenzione);
  const days = daysUntil(c.dataProssimaManutenzione);
  let dayLabel = 'Nessuna data impostata';
  if(days!==null){
    if(days<0) dayLabel = `Scaduto da ${Math.abs(days)} gg`;
    else if(days===0) dayLabel = 'Scade oggi';
    else dayLabel = `Tra ${days} gg`;
  }
  let matchExtra = '';
  if(state.filter==='revisione' || state.filter==='scadenza'){
    const y = currentYear();
    const field = state.filter==='revisione' ? 'annoRevisione' : 'annoScadenza';
    const cls = state.filter==='revisione' ? 'amber' : 'red';
    const matches = (c.apparecchi||[]).filter(a => a.categoria==='estintore' && String(a[field])===String(y));
    if(matches.length){
      matchExtra = `<div class="tag-match ${cls}">${matches.map(a=>escapeHtml(a.tipo||'Estintore')+(a.matricola?' · '+escapeHtml(a.matricola):'')).join('<br>')}</div>`;
    }
  }
  return `
  <div class="tag-card">
    <div class="tag-bar" style="background:${s.color}"></div>
    <div class="tag-hole"></div>
    <button class="tag-main" onclick="openDetail('${c.id}')">
      <div class="tag-top">
        <div>
          <p class="tag-eyebrow">${c.numApparecchi||0} apparecchi · ${cyclePairLabel(c)}</p>
          <p class="tag-title">${escapeHtml(c.nome)}</p>
        </div>
        <span class="tag-status" style="background:${s.bg};color:${s.color}">${s.label}</span>
      </div>
      <div class="tag-addr">${ICON_PIN}<span>${escapeHtml(c.indirizzo)||'Indirizzo non indicato'}</span></div>
    </button>
    ${matchExtra}
    <div class="tag-foot">
      <div>
        <p class="tag-date-label">Prossima manutenzione</p>
        <p class="tag-date-val">${fmtDate(c.dataProssimaManutenzione)} <span style="color:${s.color}">· ${dayLabel}</span></p>
      </div>
      <div class="tag-actions">
        <button title="Modifica" onclick="openForm('${c.id}')">${ICON_PENCIL}</button>
        <button title="Elimina" onclick="deleteClient('${c.id}')">${ICON_TRASH}</button>
      </div>
    </div>
  </div>`;
}
function clientGridHtml(){
  if(state.loading) return '<p class="empty-hint">Caricamento…</p>';
  const list = filteredClients();
  if(list.length===0){
    return `<div class="empty-block">${state.clients.length===0 ? "Nessun cliente registrato. Aggiungi il primo per iniziare." : "Nessun cliente corrisponde ai filtri attuali."}</div>`;
  }
  return list.map(clientTag).join('');
}
function updateListDynamic(){
  const dash = document.getElementById('dash-grid');
  const grid = document.getElementById('client-grid');
  if(dash) dash.innerHTML = dashTilesHtml();
  if(grid) grid.innerHTML = clientGridHtml();
}
function renderList(){
  return `
    <div id="dash-grid" class="dash-grid">${dashTilesHtml()}</div>
    <div class="search-wrap">
      <input id="search-input" value="${escapeHtml(state.query)}" oninput="handleSearchInput(this.value)" placeholder="Cerca cliente o indirizzo…" />
    </div>
    <button class="btn btn-outline btn-block" onclick="generateFullPDF()" style="margin-top:10px">${ICON_PRINTER} Stampa / esporta elenco completo (backup cartaceo)</button>
    <div id="client-grid" class="client-grid">${clientGridHtml()}</div>
  `;
}

/* ---------------- Vista: Calendario ---------------- */
function calClientRow(c){
  const s = statusOf(c.dataProssimaManutenzione);
  return `<button class="cal-row" style="border-left-color:${s.color}" onclick="openDetail('${c.id}')">
    <span class="cal-row-name">${escapeHtml(c.nome)}</span>
    <span class="cal-row-date">${fmtDate(c.dataProssimaManutenzione)}</span>
  </button>`;
}
function renderCalendar(){
  const buckets = Array.from({length:12}, () => []);
  const senzaData = [];
  state.clients.forEach(c=>{
    if(!c.dataProssimaManutenzione){ senzaData.push(c); return; }
    const m = new Date(c.dataProssimaManutenzione+'T00:00:00').getMonth();
    buckets[m].push(c);
  });
  const months = MONTHS_IT.map((name, i) => {
    const list = buckets[i].sort((a,b)=> a.dataProssimaManutenzione < b.dataProssimaManutenzione ? -1 : 1);
    return `<div class="cal-month">
      <div class="cal-month-head"><span>${name}</span><span class="cal-count">${list.length}</span></div>
      <div class="cal-month-body">${list.length ? list.map(calClientRow).join('') : '<p class="empty-hint-sm">Nessun cliente</p>'}</div>
    </div>`;
  }).join('');
  const unscheduled = senzaData.length
    ? `<div class="cal-unscheduled"><h3>Senza data di manutenzione</h3>${senzaData.map(calClientRow).join('')}</div>`
    : '';
  return `<div class="cal-grid">${months}</div>${unscheduled}`;
}

/* ---------------- Vista: Mappa ---------------- */
let leafletMap = null;
function renderMap(){
  return `<div id="map-container" style="height:65vh;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:16px;"></div>
    <p class="map-hint">Le posizioni vengono calcolate dall'indirizzo inserito nella scheda cliente tramite geocodifica OpenStreetMap. Se un cliente non compare, apri la sua scheda, modificala e usa "Geocodifica indirizzo".</p>`;
}
function initMap(){
  const container = document.getElementById('map-container');
  if(!container || typeof L==='undefined') return;
  if(leafletMap){ leafletMap.remove(); leafletMap=null; }
  leafletMap = L.map('map-container').setView([42.5, 12.5], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
  }).addTo(leafletMap);
  const pts = state.clients.filter(c => c.lat!=null && c.lng!=null);
  if(pts.length===0) return;
  const bounds = [];
  pts.forEach(c=>{
    const s = statusOf(c.dataProssimaManutenzione);
    const marker = L.circleMarker([c.lat, c.lng], { radius:9, color:'#fff', weight:2, fillColor:s.color, fillOpacity:1 }).addTo(leafletMap);
    marker.bindPopup(`<strong>${escapeHtml(c.nome)}</strong><br>${escapeHtml(c.indirizzo||'')}<br><a href="#" onclick="openDetail('${c.id}');return false;">Apri scheda</a>`);
    bounds.push([c.lat, c.lng]);
  });
  if(bounds.length) leafletMap.fitBounds(bounds, { padding:[30,30] });
}

/* ---------------- Vista: Scheda cliente (dettaglio) ---------------- */
function renderDetail(){
  const c = state.detailCache[state.currentId];
  if(!c) return '<p class="empty-hint">Caricamento scheda…</p>';
  const s = statusOf(c.dataProssimaManutenzione);
  const estintori = (c.apparecchi||[]).filter(a=>a.categoria==='estintore');
  const altro = (c.apparecchi||[]).filter(a=>a.categoria==='altro');
  return `
  <div class="detail-wrap">
    <button class="back-btn" onclick="state.view='list';render();">${ICON_BACK} Torna all'elenco</button>
    <div class="detail-card">
      <div class="detail-head">
        <div>
          <p class="eyebrow">Cliente</p>
          <h1 class="detail-title">${escapeHtml(c.nome)}</h1>
          <p class="detail-sub">${escapeHtml(c.indirizzo)||'Indirizzo non indicato'}</p>
        </div>
        <span class="status-pill" style="background:${s.bg};color:${s.color}">${s.label}</span>
      </div>
      <dl class="detail-grid">
        <div><dt>Telefono</dt><dd>${escapeHtml(c.telefono)||'—'}</dd></div>
        <div><dt>Ciclo mensile</dt><dd>${cyclePairLabel(c)}</dd></div>
        <div><dt>Ultima manutenzione</dt><dd>${fmtDate(c.dataUltimaManutenzione)}</dd></div>
        <div><dt>Prossima manutenzione</dt><dd style="color:${s.color};font-weight:600">${fmtDate(c.dataProssimaManutenzione)}</dd></div>
      </dl>
      ${c.note ? `<p class="detail-note">${escapeHtml(c.note)}</p>` : ''}
      <div class="detail-actions">
        <button class="btn btn-primary" onclick="openForm('${c.id}')">${ICON_PENCIL} Modifica scheda</button>
        <button class="btn btn-outline" onclick="generatePDF('${c.id}')">Genera e invia PDF</button>
        <button class="btn btn-danger" onclick="deleteClient('${c.id}')">${ICON_TRASH} Elimina</button>
      </div>
    </div>

    <div class="section">
      <h3>Estintori (${estintori.length})</h3>
      ${estintori.length ? `<div class="app-grid">${estintori.map(a=>{
        const y = currentYear();
        const revDue = a.annoRevisione && String(a.annoRevisione)===String(y);
        const scadDue = a.annoScadenza && String(a.annoScadenza)===String(y);
        return `
        <div class="app-card">
          <p class="app-type">${escapeHtml(a.tipo)}${a.annoProduzione ? ' · prod. '+escapeHtml(a.annoProduzione) : ''}</p>
          <p class="app-matricola">${escapeHtml(a.matricola)||'Senza matricola'}</p>
          <p class="app-pos">${escapeHtml(a.posizione)||'—'}${a.capacita ? ' · '+escapeHtml(a.capacita) : ''}</p>
          <p class="app-years">
            <span class="${revDue?'due amber':''}">Revisione: ${escapeHtml(a.annoRevisione)||'—'}</span>
            <span class="${scadDue?'due red':''}">Scadenza: ${escapeHtml(a.annoScadenza)||'—'}</span>
          </p>
        </div>`;}).join('')}</div>` : '<p class="empty-hint-sm">Nessun estintore registrato.</p>'}
    </div>

    <div class="section">
      <h3>Altro (${altro.length})</h3>
      ${altro.length ? `<div class="app-grid">${altro.map(a=>`
        <div class="app-card">
          <p class="app-type">${escapeHtml(a.nome)||'Elemento'}</p>
          <p class="app-pos">${escapeHtml(a.note)||'—'}</p>
        </div>`).join('')}</div>` : '<p class="empty-hint-sm">Nessun altro elemento registrato.</p>'}
    </div>

    ${(c.foto && c.foto.length) ? `<div class="section">
      <h3>Foto (${c.foto.length})</h3>
      <div class="photo-grid">${c.foto.map(p=>`<img src="${p.dataUrl}" class="photo-view" alt="foto cliente" />`).join('')}</div>
    </div>` : ''}

    ${c.firma ? `<div class="section">
      <h3>Firma cliente</h3>
      <img src="${c.firma}" class="signature-view" alt="firma cliente" />
      <p class="empty-hint-sm">Firmata il ${fmtDate(c.firmaData)}</p>
    </div>` : ''}
  </div>`;
}

/* ---------------- Vista: Form ---------------- */
function renderForm(){
  const editing = state.editingId ? state.detailCache[state.editingId] : null;
  const cancelView = editing ? 'detail' : 'list';
  return `
  <div class="form-wrap">
    <button class="back-btn" onclick="state.view='${cancelView}';render();">${ICON_BACK} Torna indietro</button>
    <form id="client-form" onsubmit="saveClientForm(event)">
      <h2 class="form-title">${editing ? 'Modifica cliente' : 'Nuovo cliente'}</h2>

      <div class="field"><label>Nome cliente *</label>
        <input id="f-nome" required value="${escapeHtml(editing?editing.nome:'')}" placeholder="es. Ristorante Da Mario" />
      </div>

      <div class="field-row">
        <div class="field"><label>Indirizzo</label>
          <input id="f-indirizzo" value="${escapeHtml(editing?editing.indirizzo:'')}" placeholder="Via, civico, città" />
        </div>
        <div class="field"><label>Telefono</label>
          <input id="f-telefono" value="${escapeHtml(editing?editing.telefono:'')}" placeholder="Contatto" />
        </div>
      </div>
      <div class="geocode-row">
        <button type="button" class="btn btn-outline btn-sm" onclick="geocodeIndirizzo()">${ICON_PIN} Geocodifica indirizzo</button>
        <span id="geocode-status" class="geocode-status">${state.draftLatLng ? 'Posizione già impostata.' : ''}</span>
      </div>

      <div class="field-row">
        <div class="field"><label>Ultima manutenzione</label>
          <input type="date" id="f-ultima" value="${editing&&editing.dataUltimaManutenzione?editing.dataUltimaManutenzione:''}" onchange="autoNextDate()" />
        </div>
        <div class="field"><label>Prossima manutenzione</label>
          <input type="date" id="f-prossima" value="${editing&&editing.dataProssimaManutenzione?editing.dataProssimaManutenzione:addMonths(todayISO(),6)}" />
        </div>
      </div>

      <div class="field"><label>Note generali</label><textarea id="f-note" rows="2">${escapeHtml(editing?editing.note:'')}</textarea></div>

      <div class="apparecchi-section">
        <div class="section-head">
          <h3>Apparecchi</h3>
          <div class="section-actions">
            <button type="button" class="btn btn-sm btn-outline" onclick="addApparecchio('estintore')">${ICON_PLUS} Estintore</button>
            <button type="button" class="btn btn-sm btn-outline" onclick="addApparecchio('altro')">${ICON_PLUS} Altro</button>
          </div>
        </div>
        <div id="apparecchi-list"></div>
      </div>

      <div class="photos-section">
        <div class="section-head"><h3>Foto</h3></div>
        <label class="photo-upload-btn">
          ${ICON_CAMERA} Aggiungi foto
          <input type="file" accept="image/*" multiple onchange="handlePhotoUpload(this)" style="display:none" />
        </label>
        <div id="photos-list" class="photos-list"></div>
      </div>

      <div class="signature-section">
        <div class="section-head">
          <h3>Firma cliente</h3>
          <button type="button" class="btn btn-sm btn-outline" onclick="clearSignature()">Cancella firma</button>
        </div>
        <canvas id="sig-canvas" width="500" height="160" class="sig-canvas"></canvas>
        <p class="empty-hint-sm">Fai firmare il cliente direttamente sullo schermo del dispositivo.</p>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-outline" onclick="state.view='${cancelView}';render();">Annulla</button>
        <button type="submit" class="btn btn-primary">${editing ? 'Salva modifiche' : 'Aggiungi cliente'}</button>
      </div>
    </form>
  </div>`;
}

/* ---------------- Layout generale ---------------- */
function headerHtml(){
  return `
  <header class="topbar">
    <div class="topbar-inner container">
      <div class="brand">
        <div class="brand-badge"><img src="${ICON_BADGE_SRC}" alt="Icona estintore" /></div>
        <div>
          <p class="brand-title">Registro Clienti · Estintori</p>
        </div>
      </div>
      ${state.view!=='form' ? `<button class="btn btn-primary btn-sm" onclick="openForm(null)">${ICON_PLUS} Nuovo cliente</button>` : ''}
    </div>
    ${state.view!=='form' ? `
    <nav class="tabs container">
      <button class="tab ${state.view==='list'?'active':''}" onclick="state.view='list';render();">Elenco</button>
      <button class="tab ${state.view==='calendar'?'active':''}" onclick="state.view='calendar';render();">Calendario</button>
      <button class="tab ${state.view==='map'?'active':''}" onclick="state.view='map';render();">Mappa</button>
    </nav>` : ''}
  </header>
  ${state.error ? `<div class="container"><div class="error-banner">${escapeHtml(state.error)}</div></div>` : ''}
  `;
}
function bodyHtml(){
  if(state.view==='list') return `<main class="container">${renderList()}</main>`;
  if(state.view==='calendar') return `<main class="container">${renderCalendar()}</main>`;
  if(state.view==='map') return `<main class="container">${renderMap()}</main>`;
  if(state.view==='form') return `<main class="container">${renderForm()}</main>`;
  if(state.view==='detail') return `<main class="container">${renderDetail()}</main>`;
  return '';
}
function render(){
  document.getElementById('app').innerHTML = headerHtml() + bodyHtml();
  if(state.view==='form'){
    renderApparecchiList();
    renderPhotosList();
    setTimeout(initSignaturePad, 0);
  }
  if(state.view==='map'){
    setTimeout(initMap, 30);
  }
  if(state.view==='detail' && !state.detailCache[state.currentId]){
    fetchDetailAndRerender(state.currentId);
  }
}

loadIndex();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
